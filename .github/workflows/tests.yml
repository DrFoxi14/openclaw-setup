name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # The suite is standard-library only apart from pytest itself.
      # PYTHONPATH=src is required: tests import memory_flush and
      # topic_reset_trigger as top-level modules, not as a package.
      - name: Run tests
        run: PYTHONPATH=src python -m pytest src/ tools/ -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
